<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc,
  addDoc, increment, serverTimestamp, query, where, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAuQGXQLhdkQ9IvJ4v3D14afdHmAgU3LOw",
  authDomain: "azqfile.firebaseapp.com",
  projectId: "azqfile",
  storageBucket: "azqfile.firebasestorage.app",
  messagingSenderId: "329891861242",
  appId: "1:329891861242:web:094003e12667039ff72f43"
};

const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";

let db, auth, provider;
if (isConfigured) {
  const fbApp = initializeApp(firebaseConfig);
  db = getFirestore(fbApp);
  auth = getAuth(fbApp);
  provider = new GoogleAuthProvider();
}

const COLLECTION = "shortUrls";
const CODE_CHARS = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 1とi、oと0などの紛らわしい文字を除外
const CODE_LENGTH = 6;

function genCode(len = CODE_LENGTH) {
  let s = "";
  for (let i = 0; i < len; i++) {
    s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  }
  return s;
}

function isValidUrl(str) {
  try {
    const u = new URL(str);
    return u.protocol === "http:" || u.protocol === "https:";
  } catch {
    return false;
  }
}

function shortLinkFor(code) {
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("c", code);
  return url.toString();
}

function detectDevice() {
  const ua = navigator.userAgent;
  if (/ipad|tablet|(android(?!.*mobile))/i.test(ua)) return "tablet";
  if (/mobile|iphone|android/i.test(ua)) return "mobile";
  return "desktop";
}

function detectReferrer() {
  if (!document.referrer) return "direct";
  try {
    return new URL(document.referrer).hostname || "direct";
  } catch {
    return "direct";
  }
}

// ---------- リダイレクト処理 ----------
async function tryRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("c");
  if (!code) return false;

  document.getElementById("redirectScreen").style.display = "block";

  try {
    const ref = doc(db, COLLECTION, code);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      document.getElementById("redirectScreen").innerHTML =
        '<p>このリンクは見つかりませんでした。</p>' +
        '<p><a href="' + window.location.pathname + '" style="color:#3568e8">トップに戻る</a></p>';
      return true;
    }

    // アクセスログを記録する部分(失敗の場合は失敗ログを記録する)
    const accessesRef = collection(db, COLLECTION, code, "accesses");
    addDoc(accessesRef, {
      timestamp: serverTimestamp(),
      referrer: detectReferrer(),
      device: detectDevice()
    }).catch(() => {});
    updateDoc(ref, { clicks: increment(1) }).catch(() => {});

    window.location.replace(snap.data().longUrl);
    return true;
  } catch (e) {
    document.getElementById("redirectScreen").innerHTML =
      '<p>アクセスしたリンクが存在するか確認してください
</p>';
    return true;
  }
}

// ---------- 作成uiの処理 ----------
async function createShortUrl(user) {
  const longUrlInput = document.getElementById("longUrl");
  const customCodeInput = document.getElementById("customCode");
  const errorMsg = document.getElementById("errorMsg");
  const result = document.getElementById("result");
  const createBtn = document.getElementById("createBtn");

  errorMsg.classList.remove("show");
  result.classList.remove("show");

  const longUrl = longUrlInput.value.trim();
  let customCode = customCodeInput.value.trim();

  if (!isValidUrl(longUrl)) {
    errorMsg.textContent = "http:// または https:// から始まる正しいURLを入力してください。";
    errorMsg.classList.add("show");
    return;
  }

  if (customCode && !/^[a-zA-Z0-9_-]{3,32}$/.test(customCode)) {
    errorMsg.textContent = "エイリアスは半角英数字・ハイフン・アンダーバー(スコア)で3〜32文字にしてください。";
    errorMsg.classList.add("show");
    return;
  }

  createBtn.disabled = true;
  createBtn.textContent = "作成中...";

  try {
    let code = customCode;

    if (code) {
      const existing = await getDoc(doc(db, COLLECTION, code));
      if (existing.exists()) {
        errorMsg.textContent = "そのエイリアスはすでに使われています。別のエイリアスをお試しください。";
        errorMsg.classList.add("show");
        return;
      }
    } else {
      let attempts = 0;
      while (attempts < 5) {
        code = genCode();
        const existing = await getDoc(doc(db, COLLECTION, code));
        if (!existing.exists()) break;
        attempts++;
      }
    }

    await setDoc(doc(db, COLLECTION, code), {
      longUrl,
      ownerUid: user ? user.uid : null,
      createdAt: serverTimestamp(),
      clicks: 0
    });

    const shortLink = shortLinkFor(code);
    const linkEl = document.getElementById("shortUrlLink");
    linkEl.href = shortLink;
    linkEl.textContent = shortLink;
    result.classList.add("show");

    longUrlInput.value = "";
    customCodeInput.value = "";

    if (user) loadMyLinks(user);
  } catch (e) {
    errorMsg.textContent = "不明なエラーが発生しました。時間をおいて再度お試しください。";
    errorMsg.classList.add("show");
  } finally {
    createBtn.disabled = false;
    createBtn.textContent = "短縮する";
  }
}

// ---------- 自分のリンク一覧 ----------
async function loadMyLinks(user) {
  const listEl = document.getElementById("myLinks");
  listEl.innerHTML = '<p style="color:#9aa0aa; font-size:13px;">読み込み中...</p>';

  try {
    const q = query(
      collection(db, COLLECTION),
      where("ownerUid", "==", user.uid),
      orderBy("createdAt", "desc"),
      limit(20)
    );
    const snap = await getDocs(q);

    if (snap.empty) {
      listEl.innerHTML = '<p style="color:#9aa0aa; font-size:13px;">まだリンクを作成していません。</p>';
      return;
    }

    listEl.innerHTML = "";
    snap.forEach(d => {
      const data = d.data();
      const code = d.id;

      const row = document.createElement("div");
      row.className = "link-row";
      row.innerHTML =
        '<div class="link-row-top">' +
          '<div>' +
            '<a class="short" href="' + shortLinkFor(code) + '" target="_blank">/' + code + '</a><br>' +
            '<span class="long" title="' + data.longUrl.replace(/"/g, "&quot;") + '">' + data.longUrl + '</span>' +
          '</div>' +
          '<div style="text-align:right;">' +
            '<div class="clicks">' + (data.clicks || 0) + ' クリック</div>' +
            '<button class="toggle" data-code="' + code + '">解析を見る</button>' +
          '</div>' +
        '</div>' +
        '<div class="analytics-panel" id="panel-' + code + '"></div>';

      listEl.appendChild(row);
    });

    listEl.querySelectorAll(".toggle").forEach(btn => {
      btn.addEventListener("click", () => toggleAnalytics(btn.dataset.code, btn));
    });
  } catch (e) {
    console.error("自分のリンク読み込みエラー:", e);
    listEl.innerHTML = '<p style="color:#c0392b; font-size:13px;">読み込みに失敗しました。' +
      (e.message.includes("index") ? "（不明なエラーが発生しました。時間をおいて再度お試しください。）" : "") +
      '</p>';
  }
}

// ---------- 解析パネルの開閉 ----------
const analyticsCache = {};

async function toggleAnalytics(code, btn) {
  const panel = document.getElementById("panel-" + code);
  const isOpen = panel.classList.contains("show");

  if (isOpen) {
    panel.classList.remove("show");
    btn.textContent = "解析を見る";
    return;
  }

  panel.classList.add("show");
  btn.textContent = "閉じる";

  if (analyticsCache[code]) {
    renderAnalytics(panel, analyticsCache[code]);
    return;
  }

  panel.innerHTML = '<p style="color:#9aa0aa; font-size:13px;">集計中...</p>';

  try {
    const stats = await computeAnalytics(code);
    analyticsCache[code] = stats;
    renderAnalytics(panel, stats);
  } catch (e) {
    panel.innerHTML = '<p style="color:#c0392b; font-size:13px;">解析データの取得に失敗しました。時間をおいて再度お試しください。</p>';
  }
}

async function computeAnalytics(code) {
  const accessesRef = collection(db, COLLECTION, code, "accesses");
  const q = query(accessesRef, orderBy("timestamp", "desc"), limit(500));
  const snap = await getDocs(q);

  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startWeek = new Date(startToday.getTime() - 6 * 24 * 60 * 60 * 1000);

  let todayCount = 0, weekCount = 0, total = 0;
  const refCounts = {};
  const devCounts = {};

  snap.forEach(d => {
    const data = d.data();
    total++;
    const t = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : null;
    if (t) {
      if (t >= startToday) todayCount++;
      if (t >= startWeek) weekCount++;
    }
    const ref = data.referrer || "direct";
    refCounts[ref] = (refCounts[ref] || 0) + 1;
    const dev = data.device || "unknown";
    devCounts[dev] = (devCounts[dev] || 0) + 1;
  });

  return { total, todayCount, weekCount, refCounts, devCounts, sampled: snap.size >= 500 };
}

function renderBreakdown(counts, total) {
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
  if (entries.length === 0) return '<p style="color:#9aa0aa; font-size:12px;">データがありません</p>';
  return entries.map(([key, count]) => {
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    return '<div class="breakdown-row">' +
      '<span class="key" title="' + key + '">' + key + '</span>' +
      '<span class="bar-bg"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
      '<span class="count">' + count + '</span>' +
      '</div>';
  }).join("");
}

function renderAnalytics(panel, stats) {
  const deviceLabels = { desktop: "パソコン", mobile: "スマートフォン", tablet: "タブレット", unknown: "不明" };
  const devCountsLabeled = {};
  Object.entries(stats.devCounts).forEach(([k, v]) => {
    devCountsLabeled[deviceLabels[k] || k] = v;
  });

  panel.innerHTML =
    '<div class="stat-grid">' +
      '<div class="stat-box"><div class="num">' + stats.total + '</div><div class="label">累計アクセス</div></div>' +
      '<div class="stat-box"><div class="num">' + stats.todayCount + '</div><div class="label">今日</div></div>' +
      '<div class="stat-box"><div class="num">' + stats.weekCount + '</div><div class="label">過去7日間</div></div>' +
    '</div>' +
    '<div class="breakdown-title">アクセス元</div>' +
    renderBreakdown(stats.refCounts, stats.total) +
    '<div class="breakdown-title">デバイス</div>' +
    renderBreakdown(devCountsLabeled, stats.total) +
    (stats.sampled ? '<p class="analytics-note">直近500件のアクセスをもとに集計しています</p>' : '');
}

// ---------- 認証まわり ----------
function updateUserBar(user) {
  const loggedOutBar = document.getElementById("loggedOutBar");
  const loggedInBar = document.getElementById("loggedInBar");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const myLinksCard = document.getElementById("myLinksCard");

  if (user) {
    loggedOutBar.style.display = "none";
    loggedInBar.style.display = "flex";
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    document.getElementById("userPhoto").src = user.photoURL || "";
    document.getElementById("userName").textContent = user.displayName || user.email || "";
    myLinksCard.style.display = "block";
  } else {
    loggedOutBar.style.display = "flex";
    loggedInBar.style.display = "none";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
    myLinksCard.style.display = "none";
  }
}

async function handleLogin() {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    alert("ログインに失敗しました: " + e.message);
  }
}

async function handleLogout() {
  await signOut(auth);
}

// ---------- 初期化 ----------
(async function init() {
  const redirected = await tryRedirect();
  if (redirected) return;

  document.getElementById("app").style.display = "block";

  document.getElementById("loginBtn").addEventListener("click", handleLogin);
  document.getElementById("logoutBtn").addEventListener("click", handleLogout);

  document.getElementById("createBtn").addEventListener("click", () => {
    createShortUrl(auth.currentUser);
  });
  document.getElementById("longUrl").addEventListener("keydown", (e) => {
    if (e.key === "Enter") createShortUrl(auth.currentUser);
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    const link = document.getElementById("shortUrlLink").textContent;
    navigator.clipboard.writeText(link).then(() => {
      const btn = document.getElementById("copyBtn");
      const orig = btn.textContent;
      btn.textContent = "コピーしました";
      setTimeout(() => btn.textContent = orig, 1500);
    });
  });

  onAuthStateChanged(auth, (user) => {
    updateUserBar(user);
    if (user) loadMyLinks(user);
  });
})();
</script>
</body>
</html>
